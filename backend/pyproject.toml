[project]
name = "invj"
version = "0.1.0"
description = "Arena for testing Jev-style decision models and LLMs on historical market replays"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Local System-1 models. Heavy (torch), so opt-in.
laya = ["laya>=0.3.20"]
gliner = ["gliner>=0.2.20"]
local = ["laya>=0.3.20", "gliner>=0.2.20"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
